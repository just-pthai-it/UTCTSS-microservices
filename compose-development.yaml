x-base-service-env-vars: &base-service-env-vars
  DB_USERNAME: ${DB_USERNAME:-user}
  DB_PASSWORD: ${DB_PASSWORD:-password}

x-base-service-db-env-vars: &base-service-db-env-vars
  POSTGRES_USER: ${DB_USERNAME:-user}
  POSTGRES_PASSWORD: ${DB_PASSWORD:-password}

x-base-service: &base-service
#  pull_policy: always
  restart: unless-stopped

services:
  my-swagger:
    container_name: my-swagger
    env_file:
      - .env
    image: ${DOCKERHUB_USERNAME:-pthaiit210501}/utconnect-go-my-swagger:dev-v1
    environment:
      SERVICE_NAME: my-swagger
    ports:
      - "4000:2000"
    <<: *base-service


  feedback:
    container_name: feedback
    env_file:
      - .env
    image: ${DOCKERHUB_USERNAME:-pthaiit210501}/utconnect-go-feedback:dev-v1
    depends_on:
      - feedback-postgres
    environment:
      <<: *base-service-env-vars
      SERVICE_NAME: feedback
      DB_HOST: feedback-postgres
      DB_NAME: feedback
    ports:
      - "5006:8080"
    networks:
      - feedback-network
      - feedback-postgres-network
    volumes:
      - feedback-data:/app/storage
    <<: *base-service

  feedback-postgres:
    container_name: feedback-postgres
    image: postgres:alpine3.19
    restart: unless-stopped
    volumes:
      - feedback-postgres-data:/var/lib/postgresql/data
    environment:
      <<: *base-service-db-env-vars
      POSTGRES_DB: feedback
    ports:
      - "54326:5432"
    networks:
      - feedback-postgres-network


  hermes:
    container_name: hermes
    env_file:
      - .env
    image: ${DOCKERHUB_USERNAME:-pthaiit210501}/utconnect-go-hermes:dev-v1
    depends_on:
      - hermes-postgres
    environment:
      <<: *base-service-env-vars
      SERVICE_NAME: hermes
      DB_HOST: hermes-postgres
      DB_NAME: hermes
    ports:
      - "5003:8080"
    networks:
      - hermes-network
      - hermes-postgres-network
    volumes:
      - hermes-data:/app/storage
    <<: *base-service

  hermes-postgres:
    container_name: hermes-postgres
    image: postgres:alpine3.19
    restart: unless-stopped
    volumes:
      - hermes-postgres-data:/var/lib/postgresql/data
    environment:
      <<: *base-service-db-env-vars
      POSTGRES_DB: hermes
    ports:
      - "54323:5432"
    networks:
      - hermes-postgres-network

  adminer:
    container_name: adminer-postgres
    image: adminer:4.8.1
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - feedback-postgres
      - hermes-postgres
    networks:
      - feedback-postgres-network
      - hermes-postgres-network

networks:
  feedback-postgres-network:
    name: feedback-postgres-network
    driver: bridge
  feedback-network:
    name: feedback-network
    driver: bridge

  hermes-postgres-network:
    name: hermes-postgres-network
    driver: bridge
  hermes-network:
    name: hermes-network
    driver: bridge

volumes:
  feedback-postgres-data:
    name: feedback-postgres-data
  feedback-data:
    name: feedback-data

  hermes-postgres-data:
    name: hermes-postgres-data
  hermes-data:
    name: hermes-data